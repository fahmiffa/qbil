<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QBIL - Offline</title>
    <meta name="theme-color" content="#0f172a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }
        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0284c7 100%);
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .icon-wrapper svg {
            width: 36px;
            height: 36px;
            stroke: #ffffff;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
            color: #ffffff;
        }
        p {
            font-size: 0.925rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.5rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            font-weight: 700;
            background: #2563eb;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        .btn-retry:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        .btn-retry:active {
            transform: translateY(0);
        }
        .btn-retry svg {
            width: 18px;
            height: 18px;
        }
        .footer-text {
            margin-top: 1.75rem;
            font-size: 0.75rem;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.34 17.52a10 10 0 1 0-2.82 2.82"/>
                <circle cx="19" cy="19" r="2"/>
                <path d="m13.41 13.41 4.18 4.18"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            Koneksi Terputus
        </div>

        <h1>Sedang Tidak Ada Jaringan</h1>
        <p>Aplikasi QBIL membutuhkan koneksi internet untuk mengelola data billing & mikrotik router. Silakan periksa jaringan Wi-Fi atau data seluler Anda.</p>

        <button class="btn-retry" onclick="checkConnection()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Coba Hubungkan Kembali
        </button>

        <div class="footer-text">
            QBIL INFRASTRUCTURE
        </div>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                const btn = document.querySelector('.btn-retry');
                const origText = btn.innerHTML;
                btn.innerHTML = 'Memeriksa sinyal...';
                setTimeout(() => {
                    if (navigator.onLine) {
                        window.location.reload();
                    } else {
                        btn.innerHTML = origText;
                        alert('Koneksi internet belum tersedia. Silakan hubungkan perangkat Anda ke jaringan internet terlebih dahulu.');
                    }
                }, 1200);
            }
        }

        // Auto reload when back online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
