<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qbil-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#qbil-grad)" />

  <!-- Inner subtle ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4" />

  <!-- QBIL Icon Group -->
  <g transform="translate(106, 106) scale(12.5)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Radar Arc -->
    <path d="M20.34 17.52a10 10 0 1 0-2.82 2.82" fill="none" stroke="#ffffff" stroke-width="2.4" />
    
    <!-- Outer Node -->
    <circle cx="19" cy="19" r="2.2" fill="#93c5fd" stroke="#ffffff" stroke-width="0.8" />
    
    <!-- Connecting Line -->
    <path d="m13.41 13.41 4.18 4.18" fill="none" stroke="#ffffff" stroke-width="2.4" />
    
    <!-- Center Node -->
    <circle cx="12" cy="12" r="2.2" fill="#ffffff" />
  </g>
</svg>